services:
  - type: web
    name: eventsphere
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: eventsphere-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_API_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: SEED_DEMO
        value: "1"
databases:
  - name: eventsphere-db
    plan: free
