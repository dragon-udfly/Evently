{% extends "base.html" %}{% block title %}Events{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Upcoming events</h1>
<form class="row g-2 mb-3" method="get" action="/">
  <div class="col-12 col-md-4"><input class="form-control" name="q" placeholder="Search keyword" value="{{ f.q }}"></div>
  <div class="col-6 col-md-2"><select class="form-select" name="category"><option value="">All categories</option>
    {% for c in categories %}<option {{ 'selected' if f.category == c }}>{{ c }}</option>{% endfor %}</select></div>
  <div class="col-6 col-md-2"><select class="form-select" name="venue_id"><option value="">Any venue</option>
    {% for v in venues %}<option value="{{ v.id }}" {{ 'selected' if f.venue_id == v.id|string }}>{{ v.name }}</option>{% endfor %}</select></div>
  <div class="col-6 col-md-2"><input class="form-control" name="max_price" placeholder="Max price" value="{{ f.max_price }}"></div>
  <div class="col-6 col-md-2"><input class="form-control" type="date" name="date_from" value="{{ f.date_from }}"></div>
  <div class="col-12"><button class="btn btn-primary">Search</button> <a class="btn btn-link" href="/">Clear</a></div>
</form>
<div class="row g-3">
{% for e in events %}
  <div class="col-12 col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
    <span class="badge text-bg-secondary">{{ e.category }}</span>
    <h2 class="h5 mt-2"><a href="/events/{{ e.id }}" class="stretched-link text-decoration-none">{{ e.title }}</a></h2>
    <p class="mb-1 small">{{ e.start|dt }}</p>
    <p class="mb-1 small text-muted">{{ e.venue.name }}, {{ e.venue.location }}</p>
  </div></div></div>
{% endfor %}
</div>
{% endblock %}
