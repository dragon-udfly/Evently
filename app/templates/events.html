{% extends "base.html" %}{% block title %}Events{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Upcoming events</h1>
<form class="row g-2 mb-3" method="get" action="/">
  <div class="col-12 col-md-4"><input class="form-control" name="q" placeholder="Search keyword" value="{{ f.q }}"></div>
  <div class="col-6 col-md-2"><select class="form-select" name="category"><option value="">All categories</option>
    {% for c in categories %}<option {{ 'selected' if f.category == c }}>{{ c }}</option>{% endfor %}</select></div>
</form>
{% endblock %}
