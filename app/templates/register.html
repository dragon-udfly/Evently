{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1 class="h3">Create an attendee account</h1>
<form method="post" action="/register">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required minlength="2"></div>
  <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
  <div class="mb-3"><label class="form-label">Password (8+ characters)</label><input class="form-control" type="password" name="password" required minlength="8"></div>
  <button class="btn btn-primary w-100">Register</button>
</form>
</div></div>
{% endblock %}
