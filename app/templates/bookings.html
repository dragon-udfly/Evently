{% extends "base.html" %}{% block title %}My bookings{% endblock %}
{% block content %}
<h1 class="h3">My bookings</h1>
<p class="small text-muted">{{ policy }}</p>
{% for b in bookings %}
<div class="card mb-3"><div class="card-body">
  <div class="d-flex justify-content-between flex-wrap gap-2">
    <div><strong>{{ b.event.title }}</strong> <span class="badge text-bg-{{ 'success' if b.status == 'confirmed' else 'secondary' }}">{{ b.status }}</span></div>
  </div>
</div></div>
{% endfor %}
{% endblock %}
