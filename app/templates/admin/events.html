{% extends "base.html" %}{% block title %}Manage events{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2"><h1 class="h3 mb-0">Events</h1><a class="btn btn-primary btn-sm" href="/admin/events/new">New event</a></div>
<div class="table-responsive"><table class="table table-sm align-middle"><thead><tr><th>Title</th><th>When</th><th>Venue</th><th>Status</th><th></th></tr></thead>
<tbody>{% for e in events %}<tr><td>{{ e.title }}</td><td>{{ e.start|dt }}</td><td>{{ e.venue.name }}</td>
<td><span class="badge text-bg-{{ {'draft':'warning','published':'success','cancelled':'secondary'}[e.status] }}">{{ e.status }}</span></td>
<td class="text-nowrap">
</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
