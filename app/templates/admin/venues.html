{% extends "base.html" %}{% block title %}Venues{% endblock %}
{% block content %}
<h1 class="h3">Venues</h1>
<form method="post" action="{{ '/admin/venues/%d' % v.id if v else '/admin/venues' }}" class="row g-2 mb-4">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="col-12"><h2 class="h5">{{ 'Edit venue' if v else 'New venue' }}</h2></div>
  <div class="col-md-6"><input class="form-control" name="name" placeholder="Name" required value="{{ v.name if v }}"></div>
  <div class="col-md-6"><input class="form-control" name="location" placeholder="Location" required value="{{ v.location if v }}"></div>
  <div class="col-6 col-md-3"><input class="form-control" type="number" min="1" name="capacity" placeholder="Capacity" required value="{{ v.capacity if v }}"></div>
  <div class="col-6 col-md-3"><input class="form-control" type="number" min="0" step="0.01" name="hourly_rate" placeholder="Hourly rate" required value="{{ v.hourly_rate if v }}"></div>
  <div class="col-md-6"><input class="form-control" name="image_url" placeholder="Image URL" value="{{ v.image_url if v }}"></div>
  <div class="col-12"><textarea class="form-control" name="description" placeholder="Description" rows="2">{{ v.description if v }}</textarea></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" name="open_for_hire" id="ofh" {{ 'checked' if v and v.open_for_hire }}><label class="form-check-label" for="ofh">Open for private hire</label></div></div>
</form>
{% endblock %}
